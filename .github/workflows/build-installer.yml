name: Build Installer

on:
  pull_request:
    paths:
      - 'src/MdReader/**'
      - 'src/MdReader.Installer/**'
      - 'tests/**'
      - '.github/workflows/build-installer.yml'
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version to build, with or without a leading v
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Resolve installer version
      id: version
      shell: pwsh
      env:
        REQUESTED_VERSION: ${{ inputs.version }}
      run: |
        $version = ([xml](Get-Content src/MdReader/MdReader.csproj -Raw)).Project.PropertyGroup.Version | Select-Object -First 1
        if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid source version' }
        $release = $env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -or $env:GITHUB_REF -like 'refs/tags/v*'
        if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Release dispatch must run on main' }
          if ($env:REQUESTED_VERSION.Trim().TrimStart('v') -ne $version) { throw 'Requested version differs from source' }
        }
        if ($release) {
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Release tag differs from source version'
          }
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch main' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release commit must be merged into main' }
          $existing = git tag --list "v$version"
          if ($existing) {
            $tagCommit = git rev-list -n 1 "v$version"
            $headCommit = git rev-parse HEAD
            if ($tagCommit -ne $headCommit) { throw 'Existing release tag points to another commit' }
          }
        }
        "version=$version" >> $env:GITHUB_OUTPUT
        "release=$($release.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

    - name: Install Inno Setup
      run: |
        choco install innosetup -y
      shell: pwsh

    - name: Test runtime publisher verification
      shell: pwsh
      run: |
        ./tests/Verify-RuntimeSignature.Tests.ps1
        ./tests/Verify-RuntimeSignature.Integration.Tests.ps1

    - name: Build installer
      run: >
        & ".\src\MdReader.Installer\build-and-create-installer.ps1"
        -Configuration Release
        -AppVersion "${{ steps.version.outputs.version }}"
      shell: pwsh

    - name: Smoke test installer on Windows
      shell: pwsh
      env:
        APP_VERSION: ${{ steps.version.outputs.version }}
      run: ./tests/Installer.Smoke.Tests.ps1 -Version $env:APP_VERSION

    - name: Preserve installer diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: installer-diagnostics
        path: installer-output/logs/
        if-no-files-found: ignore

    - name: Upload tested installer
      uses: actions/upload-artifact@v4
      with:
        name: MdReaderSetup-${{ steps.version.outputs.version }}
        path: installer-output/MdReaderSetup-${{ steps.version.outputs.version }}.exe
        if-no-files-found: error

  release:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MdReaderSetup-${{ needs.build.outputs.version }}
          path: release
      - name: Publish tested installer
        uses: softprops/action-gh-release@v2
        with:
          files: release/MdReaderSetup-${{ needs.build.outputs.version }}.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
