name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
      working-directory: ./src/MdReader
    
    - name: Build
      run: dotnet build --configuration Release --no-restore
      working-directory: ./src/MdReader
    
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: tests/package-lock.json

    - name: Install browser test dependencies
      run: npm ci
      working-directory: tests

    - name: Install Chromium
      run: npx playwright install chromium
      working-directory: tests

    - name: Test diagram rendering and interactions
      run: npm test
      working-directory: tests

    - name: Publish framework-dependent application
      shell: pwsh
      run: ./src/MdReader.Installer/build-installer.ps1

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MdReader-win-x64
        path: src/MdReader/bin/Release/net9.0-windows/win-x64/publish/
